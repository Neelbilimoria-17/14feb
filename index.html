<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  width: 360px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
  margin-bottom: 15px;
}

.buttons {
  position: relative;
  height: 140px;
}

/* COMMON BUTTON */
button {
  padding: 12px 28px;
  font-size: 18px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  position: absolute;
  min-width: 90px;
  transition: left 0.15s ease, top 0.15s ease;
}

/* YES (LOCKED POSITION) */
#yes {
  background: #ff4d6d;
  color: white;
  left: 40px;
  top: 50px;
  z-index: 2;
}

/* NO */
#no {
  background: #eee;
  color: black;
  left: 220px;
  top: 50px;
  z-index: 1;
}

#gif {
  display: none;
  margin-top: 20px;
  width: 220px;
}

/* hearts */
.heart {
  position: fixed;
  font-size: 22px;
  animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-300px); opacity: 0; }
}
</style>
</head>

<body>

<div class="card">
  <h1>Will you be my Valentine? ❤️</h1>

  <div class="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <img id="gif" src="oh-wow-you-dont-say.gif">
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const gif = document.getElementById("gif");

/* SAFE POSITIONS — NONE TOUCH YES */
const safePositions = [
  { x: 220, y: 10 },
  { x: 220, y: 90 },
  { x: 260, y: 50 },
  { x: 180, y: 10 },
  { x: 180, y: 90 }
];

let index = 0;

noBtn.addEventListener("click", () => {
  index = (index + 1) % safePositions.length;
  noBtn.style.left = safePositions[index].x + "px";
  noBtn.style.top = safePositions[index].y + "px";
});

/* YES */
yesBtn.addEventListener("click", () => {
  document.querySelector(".buttons").style.display = "none";
  gif.style.display = "block";
  hearts();
});

function hearts() {
  for (let i = 0; i < 20; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "❤️";
    h.style.left = Math.random() * window.innerWidth + "px";
    h.style.top = window.innerHeight + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 3000);
  }
}
</script>

</body>
</html>
