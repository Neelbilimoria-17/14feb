<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💘</title>

  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* Floating background hearts */
    .heart {
      position: absolute;
      color: rgba(255, 0, 100, 0.4);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    /* Heart pop animation */
    .pop-heart {
      position: absolute;
      font-size: 24px;
      animation: pop 1s ease-out forwards;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes pop {
      0% {
        transform: scale(0) translateY(0);
        opacity: 1;
      }
      100% {
        transform: scale(1.5) translateY(-120px);
        opacity: 0;
      }
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }

    h2 {
      margin-bottom: 20px;
    }

    .buttons {
      position: relative;
      height: 60px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      position: absolute;
    }

    #yes {
      left: 40px;
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      right: 40px;
      background-color: #ccc;
    }

    #gif {
      display: none;
      margin-top: 20px;
    }

    #gif img {
      width: 200px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <!-- Floating hearts -->
  <script>
    for (let i = 0; i < 20; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 15) + "px";
      heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
      document.body.appendChild(heart);
    }
  </script>

  <div class="box" id="box">
    <h2>Will you be my Valentine? 💖</h2>

    <div class="buttons" id="buttons">
      <button id="yes" onclick="sayYes()">Yes</button>
      <button id="no" onclick="moveNo()">No</button>
    </div>

    <div id="gif">
      <img src="oh-wow-you-dont-say.gif" alt="Wow GIF">
    </div>
  </div>

  <script>
    function moveNo() {
      const noBtn = document.getElementById("no");
      const maxX = 220;
      const maxY = 60;

      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
    }

    function sayYes() {
      document.getElementById("buttons").style.display = "none";
      document.getElementById("gif").style.display = "block";
      popHearts();
    }

    function popHearts() {
      const box = document.getElementById("box");
      const rect = box.getBoundingClientRect();

      for (let i = 0; i < 15; i++) {
        const heart = document.createElement("div");
        heart.className = "pop-heart";
        heart.innerHTML = "❤️";
        heart.style.left = rect.left + rect.width / 2 + "px";
        heart.style.top = rect.top + rect.height / 2 + "px";
        heart.style.transform = `translate(${Math.random() * 200 - 100}px, ${Math.random() * -150}px)`;

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 1000);
      }
    }
  </script>

</body>
</html>
