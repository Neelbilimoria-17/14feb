<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  width: 360px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
  margin-bottom: 10px;
}

.heart-icon {
  font-size: 28px;
  margin-bottom: 25px;
}

.buttons {
  position: relative;
  height: 120px;
}

/* BUTTON BASE */
button {
  padding: 12px 28px;
  font-size: 18px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  position: absolute;
  min-width: 90px;
  transition: left 0.12s linear, top 0.12s linear;
}

/* YES */
#yes {
  background: #ff4d6d;
  color: white;
  left: 40px;
  top: 40px;
}

/* NO */
#no {
  background: #eee;
  color: black;
  left: 200px;
  top: 40px;
}

#gif {
  display: none;
  margin-top: 20px;
  width: 220px;
}

/* hearts */
.heart {
  position: fixed;
  font-size: 22px;
  animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-300px); opacity: 0; }
}
</style>
</head>

<body>

<div class="card">
  <h1>Will you be my Valentine? ❤️</h1>
  <div class="heart-icon">💖</div>

  <div class="buttons" id="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <img id="gif" src="oh-wow-you-dont-say.gif">
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const buttons = document.getElementById("buttons");
const gif = document.getElementById("gif");

noBtn.addEventListener("click", () => {
  const yesRect = yesBtn.getBoundingClientRect();
  const containerRect = buttons.getBoundingClientRect();

  let x, y, tries = 0;

  do {
    x = Math.random() * (containerRect.width - noBtn.offsetWidth);
    y = Math.random() * (containerRect.height - noBtn.offsetHeight);

    const noRect = {
      left: containerRect.left + x,
      right: containerRect.left + x + noBtn.offsetWidth,
      top: containerRect.top + y,
      bottom: containerRect.top + y + noBtn.offsetHeight
    };

    var overlap =
      !(noRect.right < yesRect.left ||
        noRect.left > yesRect.right ||
        noRect.bottom < yesRect.top ||
        noRect.top > yesRect.bottom);

    tries++;
  } while (overlap && tries < 50);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

/* YES */
yesBtn.addEventListener("click", () => {
  buttons.style.display = "none";
  gif.style.display = "block";
  hearts();
});

function hearts() {
  for (let i = 0; i < 20; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "❤️";
    h.style.left = Math.random() * window.innerWidth + "px";
    h.style.top = window.innerHeight + "px";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 3000);
  }
}
</script>

</body>
</html>
