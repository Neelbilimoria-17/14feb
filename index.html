<!DOCTYPE html>
<html>
<head>
  <title>Valentine ❤️</title>

  <style>
    body {
      background: #f7b0b0;
      font-family: Arial;
      text-align: center;
      padding-top: 120px;
    }

    h1 {
      color: white;
      font-size: 42px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: white;
      position: absolute;
    }

    #gif {
      display: none;
      margin-top: 20px;
      width: 200px;
    }

    .heart {
      position: fixed;
      color: red;
      font-size: 24px;
      animation: float 3s linear infinite;
    }

    @keyframes float {
      0% {transform: translateY(0);}
      100% {transform: translateY(-600px);}
    }
  </style>
</head>

<body>

<h1>Will you be my Valentine ❤️</h1>

<button id="yes">Yes</button>
<button id="no">No</button>

<br>
<img id="gif" src="oh-wow-you-dont-say.gif">

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const gif = document.getElementById("gif");

  // NO button runs away
  noBtn.onclick = function () {
    const x = Math.random() * window.innerWidth * 0.7;
    const y = Math.random() * window.innerHeight * 0.6;
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  };

  // YES button
  yesBtn.onclick = function () {

    gif.style.display = "block";

    // hearts animation
    for (let i = 0; i < 20; i++) {
      let heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.top = "100vh";
      document.body.appendChild(heart);
    }

    // 🔥 OPEN DIGITS PAGE AFTER 3 SECONDS
    setTimeout(function(){
      window.location.href = "https://neelbilimoria-17.github.io/14feb/";
    }, 3000);
  };
</script>

</body>
</html>
