<!DOCTYPE html>
<html>
<head>
  <title>Will You Be My Valentine ❤️</title>

  <style>
    body {
      background: #f4a6a6;
      font-family: Arial;
      text-align: center;
      padding-top: 120px;
      overflow: hidden;
    }

    h1 {
      color: white;
      font-size: 40px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      width: 120px;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: white;
      position: absolute;
      left: 52%;
      top: 55%;
    }

    #gif {
      display: none;
      margin-top: 20px;
      width: 220px;
    }

    .heart {
      position: fixed;
      color: red;
      font-size: 22px;
      animation: float 3s linear forwards;
    }

    @keyframes float {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-700px);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <h1>Will you be my Valentine ❤️</h1>

  <button id="yes">Yes</button>
  <button id="no">No</button>

  <br>
  <img id="gif" src="oh-wow-you-dont-say.gif">

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const gif = document.getElementById("gif");

    // NO button moves when clicked (same size, just shifts place)
    noBtn.onclick = function () {
      const x = Math.random() * (window.innerWidth - 150);
      const y = Math.random() * (window.innerHeight - 150);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    };

    // YES button
    yesBtn.onclick = function () {

      gif.style.display = "block";

      // create floating hearts
      for (let i = 0; i < 25; i++) {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "100vh";
        document.body.appendChild(heart);
      }

      // open Formspree digits page after 3 seconds
      setTimeout(function () {
        window.location.href = "https://formspree.io/f/mvzboleb";
      }, 3000);
    };
  </script>

</body>
</html>
